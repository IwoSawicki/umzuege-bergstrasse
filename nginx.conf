server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/javascript application/javascript
        application/json image/svg+xml application/xml application/rss+xml;

    # Sicherheits-Header
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Formular-Endpunkt: laeuft als eigener Node-Dienst im selben Container.
    # Gleiche Domain wie die Seite -> kein CORS, keine Drittanbieter.
    location /api/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 20s;
        client_max_body_size 64k;
        access_log off;
    }

    # Astro baut mit format:'directory' → saubere URLs ohne .html
    location / {
        try_files $uri $uri/ $uri.html /404.html;
    }

    # Gehashte Assets langfristig cachen
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Statische Dateien moderat cachen
    location ~* \.(?:css|js|svg|png|jpg|jpeg|gif|webp|avif|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    location = /robots.txt { access_log off; }

    error_page 404 /404.html;
}
